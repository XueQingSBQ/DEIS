server:
  port: 8190

spring:
  application:
    name: dris-enterprise-backend-v2
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/dris_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: sbq254172
    hikari:
      minimum-idle: 8
      maximum-pool-size: 16
      connection-timeout: 5000
      validation-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000
  sql:
    init:
      mode: always
      continue-on-error: true
      encoding: UTF-8
      schema-locations:
        - classpath:sql/mysql/schema.sql
        - classpath:sql/mysql/extension_schema.sql

dris:
  v2:
    node-id: node-local
    node-level: COUNTRY
    mode: jdbc
    region-code: 1100
    organization-code: ABCD
    drirp-enabled: true
    drirp-port: 19090
    drirp-public-url: grpc://127.0.0.1:19090
    drirp-security:
      enabled: false
      mode: enforce
      require-response-auth: true
      shared-secret: ""
      key-id: node-local
      max-skew-ms: 300000
      nonce-ttl-ms: 300000
      replay-max-entries: 100000
      allow-anonymous: false
      audit-enabled: true
    drirp-outbound-client-pool:
      max-entries: 64
      max-idle-ms: 600000
      cleanup-interval-ms: 30000
    topology-health:
      enabled: true
      initial-delay-ms: 5000
      interval-ms: 15000
      timeout-ms: 3000
      offline-threshold-ms: 45000
      offline-failure-threshold: 3
      startup-hello-max-attempts: 3
      startup-hello-retry-interval-ms: 2000
      probe-children-enabled: true
      notify-on-shutdown: true
    business-audit:
      enabled: true
      async-enabled: true
      core-pool-size: 1
      max-pool-size: 2
      queue-capacity: 2000
      keep-alive-seconds: 60
    parent-node-id: ""
    parent-drirp-url: ""
    parent-region-code: ""
    parent-organization-code: ""
    startup-hello-enabled: true
    strict-industry-validation: false
    allow-component-type-replace: false
    require-tool-spec: false
