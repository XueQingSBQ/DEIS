    resolve-timeout-ms: 5000
    resolve-allow-parent-fallback: true
    search-cache-enabled: true
    search-cache-ttl-ms: 30000
    search-cache-max-entries: 1000
    search-rate-limit-enabled: true
    search-rate-limit-qps: 100
    search-rate-limit-burst: 200
    search-circuit-breaker-enabled: true
    search-circuit-failure-threshold: 10
    search-circuit-open-ms: 10000
    search-circuit-half-open-permits: 1
    vector-auto-sync-enabled: true
